name: Release

# A pull request to main: the checks only, so a missed version bump shows before the merge.
# A push to main: the checks, then the GitHub Release and the npm publish.
# Each push to main must carry a new version. A push without one fails the run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      # Creating the tag and the GitHub Release
      contents: write
      # Minting the OIDC token npm trusted publishing verifies
      id-token: write

    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+; the one bundled with Node 22 is older.
      - name: Update npm
        run: npm install -g npm@latest

      # Version higher than on npm, package-lock.json in sync, a CHANGELOG section, no `### Unpublished` left.
      # Fails first, before the install and the build.
      - name: Check the release
        run: node scripts/check-release.mjs

      - name: Read version
        id: version
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # `npm ci` fails when package-lock.json does not match package.json.
      - name: Install dependencies
        run: npm ci

      - name: Check the format
        run: npm run format:check

      # Lint, typecheck, build: the same command as on a local machine.
      - name: Build
        run: npm run prod

      # Catches a build that emitted nothing, or an `exports` map pointing at a
      # file the build does not produce — before the version is burned on npm.
      - name: Verify the package contents
        run: |
          test -f dist/index.js || { echo "::error::dist/index.js missing"; exit 1; }
          test -f dist/index.d.ts || { echo "::error::dist/index.d.ts missing"; exit 1; }
          npm pack --dry-run

      - name: Write the release notes
        run: node scripts/changelog-section.mjs "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md

      # Before the publish: a failed publish leaves a release that a re-run of the job completes.
      # A re-run finds the release and does not create it again.
      - name: Create the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "The release v$VERSION exists. It is not created again."
            exit 0
          fi
          tar -czf "$NAME-$VERSION-dist.tar.gz" dist
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            "$NAME-$VERSION-dist.tar.gz"

      - name: Publish to npm
        if: env.PUBLISH == 'true'
        run: npm publish --access public

      - name: Summary
        if: env.PUBLISH == 'true'
        run: echo "## ✅ Published ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
